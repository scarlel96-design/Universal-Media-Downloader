const toast=document.getElementById('toast');let tm;function notify(s){toast.textContent=s;toast.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>toast.classList.remove('show'),3100)}
const cards=[...document.querySelectorAll('.media-card')];function updateCount(){const count=cards.filter(c=>c.classList.contains('selected')&&!c.hidden).length;document.getElementById('selected').textContent=count+'개 선택됨';document.getElementById('count').textContent=cards.filter(c=>!c.hidden).length+'개';document.getElementById('downloadButton').disabled=count===0}
cards.forEach(c=>c.addEventListener('click',()=>{c.classList.toggle('selected');c.setAttribute('aria-pressed',String(c.classList.contains('selected')));document.getElementById('detailImage').src=c.querySelector('img').src;document.getElementById('detailName').textContent=c.querySelector('.photo-meta').textContent;updateCount()}));
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('active',x===b));const filter=b.dataset.filter;cards.forEach((c,i)=>{c.hidden=(filter==='video'||(filter==='image'&&i%5===4))});updateCount();if(filter==='video')notify('현재 시각 시안에는 영상 샘플이 없습니다.')}));
document.getElementById('inspectToggle').onclick=()=>document.getElementById('inspector').classList.toggle('open');
document.getElementById('sidebarToggle').onclick=()=>{const s=document.getElementById('sidebar');s.style.display=s.style.display==='none'?'':'none';document.querySelector('.top').style.gridTemplateColumns=s.style.display==='none'?'0 minmax(0,1fr) auto':'';document.querySelector('.toolbar-brand').style.display=s.style.display==='none'?'none':''};
document.querySelectorAll('.side-row').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.side-row').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('pageTitle').textContent=b.dataset.page;document.getElementById('toolTitle').textContent=b.dataset.page;notify('화면 내비게이션을 나타내는 시각 시안입니다.')}));
document.getElementById('themeToggle').onclick=()=>document.body.classList.toggle('dark');
['winMin','winMax','winClose'].forEach(id=>document.getElementById(id).onclick=()=>notify('브라우저 시안에서는 창 제어를 실행하지 않습니다. 실제 앱은 Windows 네이티브 창 제어를 사용합니다.'));
document.getElementById('downloadButton').onclick=()=>notify('UI 프로토타입입니다. 실제 다운로드 기능은 구현되지 않았습니다.');
function analyze(){notify('UI 프로토타입입니다. URL 분석 엔진은 연결되지 않았습니다.')}document.getElementById('urlAction').onclick=analyze;document.getElementById('url').addEventListener('keydown',e=>{if(e.key==='Enter')analyze()});
document.getElementById('listButton').onclick=()=>notify('그리드/리스트 보기 전환은 실제 QML 구현 단계에서 연결합니다.');
document.getElementById('back').onclick=()=>notify('시안의 뒤로 가기 버튼입니다.');document.getElementById('forward').onclick=()=>notify('시안의 앞으로 가기 버튼입니다.');
updateCount();
</script></body></html>
